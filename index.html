<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Projektpriorisierung</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 20px; }
    .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h1 { font-size: 24px; margin-bottom: 10px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input[type="text"], textarea, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    .scale { display: flex; gap: 10px; margin-top: 5px; }
    .scale label { font-weight: normal; }
    button { margin-top: 20px; padding: 10px 15px; border: none; border-radius: 4px; background: #1976d2; color: white; cursor: pointer; }
    .result { margin-top: 30px; padding: 15px; background: #eef; border-left: 5px solid #1976d2; border-radius: 4px; }
    .priority { font-size: 18px; font-weight: bold; }
    .explanation { margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Projektpriorisierung</h1>
    <label>Projektname</label>
    <input type="text" id="projectName" />

    <label>Behördliche Vorgabe / Schulleitung</label>
    <select id="authority">
      <option value="no">Nein</option>
      <option value="yes">Ja</option>
    </select>

    <label>Relevant für Schulprogramm</label>
    <select id="program">
      <option value="no">Nein</option>
      <option value="yes">Ja</option>
    </select>

    <label>Optimierung Arbeitsbedingungen (0–2)</label>
    <select id="work">
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
    </select>

    <label>Anzahl profitierender Personen (0–2)</label>
    <select id="people">
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
    </select>

    <label>Verbesserung Schülerleistung / Umfeld (0–2)</label>
    <select id="quality">
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
    </select>

    <label>Entwicklungsaufwand – Ressourcen (0–2)</label>
    <select id="resources">
      <option value="0">0 (hoch)</option>
      <option value="1">1</option>
      <option value="2">2 (gering)</option>
    </select>

    <label>Implementierungsaufwand – Personen betroffen (0–2)</label>
    <select id="impPeople">
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
    </select>

    <label>Implementierungsaufwand – Routineänderung (0–2)</label>
    <select id="routine">
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
    </select>

    <label>Implementierungsaufwand – Schulung (0–2)</label>
    <select id="training">
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
    </select>

    <button onclick="calculate()">Berechnen</button>

    <div id="result" class="result" style="display:none">
      <div class="priority" id="priorityText"></div>
      <div class="explanation" id="explanationText"></div>
    </div>
  </div>

  <script>
    function calculate() {
      const authority = document.getElementById("authority").value === "yes";
      const program = document.getElementById("program").value === "yes";
      const work = parseInt(document.getElementById("work").value);
      const people = parseInt(document.getElementById("people").value);
      const quality = parseInt(document.getElementById("quality").value);
      const resources = parseInt(document.getElementById("resources").value);
      const impPeople = parseInt(document.getElementById("impPeople").value);
      const routine = parseInt(document.getElementById("routine").value);
      const training = parseInt(document.getElementById("training").value);

      const outputScore = work + people + quality;
      const devScore = resources;
      const implScore = impPeople + routine + training;
      const rawSum = outputScore + devScore + implScore;
      const norm = Math.round((rawSum / 14 * 5) * 100) / 100;

      let priority = 3;
      let rationale = "";

      if (authority) {
        priority = 1;
        rationale = "Behördliche oder schulleitungsbezogene Vorgabe → Priorität 1";
      } else if (program) {
        priority = 2;
        rationale = "Relevanz für Schulprogramm → Priorität 2";
      } else {
        if (norm >= 4.0) {
          priority = 1;
          rationale = `Normwert ${norm} → sehr hoher Nutzen bei geringem Aufwand`;
        } else if (norm >= 3.0) {
          priority = 2;
          rationale = `Normwert ${norm} → gutes Verhältnis von Nutzen zu Aufwand`;
        } else if (norm >= 2.0) {
          priority = 3;
          rationale = `Normwert ${norm} → mittlerer Nutzen bei moderatem Aufwand. Projekt ist nicht verpflichtend, aber könnte sinnvoll sein. Empfehlung: prüfen, ob Ressourcen verfügbar sind.`;
        } else {
          priority = 4;
          rationale = `Normwert ${norm} → geringer Nutzen bei hohem Aufwand. Projekt aktuell nicht priorisiert. Empfehlung: zurückstellen oder überarbeiten.`;
        }
      }

      document.getElementById("priorityText").textContent = `Priorität ${priority}`;
      document.getElementById("explanationText").textContent = rationale;
      document.getElementById("result").style.display = "block";
    }
  </script>
</body>
</html>
